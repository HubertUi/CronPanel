<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | CronPanel</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body class="login-body">
    <main class="login-container">
        <section class="login-card">
            <header class="login-header">
                <h1 class="brand">Cron<span class="brand-accent">Panel</span></h1>
                <p class="login-subtitle">Administración de tareas programadas</p>
            </header>

            <form id="login-form" autocomplete="off" novalidate>
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username"
                           required maxlength="64" autofocus
                           placeholder="Nombre de usuario">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password"
                           required maxlength="256"
                           placeholder="********">
                </div>

                <p id="login-error" class="alert alert-error hidden" role="alert"></p>

                <button type="submit" id="login-button" class="btn btn-primary btn-block">
                    Iniciar sesión
                </button>
            </form>

            <footer class="login-footer">
                <span>Acceso restringido · Toda actividad es registrada</span>
            </footer>
        </section>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
</body>
</html>
