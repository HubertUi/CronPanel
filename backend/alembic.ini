# Alembic configuration for CronPanel.
# Run from the backend/ directory.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# sqlalchemy.url is overridden in env.py from app.core.config when
# left empty; set it here only if running outside the application env.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
